name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install omlx without its dependencies (mlx/mlx-lm/mlx-vlm won't
          # install on Linux).  Then pull in the Linux-compatible runtime deps
          # and dev tools so the pure-Python tests can import everything they
          # need.
          pip install --no-deps -e .

          # Linux-compatible runtime dependencies
          pip install \
            "transformers>=5.0.0,<5.4.0" \
            "tokenizers>=0.19.0" \
            "huggingface-hub>=0.23.0" \
            "numpy>=1.24.0" \
            "tqdm>=4.66.0" \
            "pyyaml>=6.0" \
            "itsdangerous>=2.0" \
            "jinja2>=3.0" \
            "sentencepiece" \
            "tiktoken" \
            "protobuf" \
            "requests>=2.28.0" \
            "socksio>=1.0.0" \
            "tabulate>=0.9.0" \
            "psutil>=5.9.0" \
            "fastapi>=0.108.0" \
            "uvicorn>=0.23.0" \
            "jsonschema>=4.0.0" \
            "openai-harmony" \
            "Pillow>=9.0.0" \
            "xgrammar>=0.1.32"

          # Dev / test tools
          pip install \
            "pytest>=7.0.0" \
            "pytest-asyncio>=0.21.0" \
            "mcp>=1.0.0"

      - name: Run tests
        run: pytest
